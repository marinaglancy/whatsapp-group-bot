<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{PROJECT_NAME}}</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f0f2f5;
    }
    .container {
      text-align: center;
      background: white;
      padding: 2rem 3rem;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 { color: #1a1a1a; font-size: 1.5rem; margin-bottom: 0.5rem; }
    .error-box {
      background: #fce4ec;
      border: 1px solid #e57373;
      border-radius: 8px;
      padding: 1rem 1.5rem;
      margin: 1rem 0;
    }
    .error-box p { color: #c62828; margin: 0.25rem 0; }
    p { color: #667781; }
    a { color: #25d366; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <h1>{{PROJECT_NAME}}</h1>
    <div class="error-box">
      <p>Invalid or expired link.</p>
      <p>Send <strong>web</strong> to the bot to get a new one.</p>
    </div>
    <p style="margin-top: 1.5rem;"><a href="/">Back to home</a></p>
  </div>
</body>
</html>
