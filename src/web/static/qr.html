<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Bot - QR Code</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f0f2f5;
    }
    .container {
      text-align: center;
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 { color: #1a1a1a; font-size: 1.5rem; }
    #status { color: #667781; margin: 1rem 0; }
    #bot-name { color: #1a1a1a; font-weight: bold; margin: 0.25rem 0; }
    #bot-phone { color: #667781; margin: 0.25rem 0; }
    #qr-img { margin: 1rem 0; }
    #disconnect { display: none; margin-top: 1rem; }
    #disconnect a { color: #e74c3c; font-size: 0.85rem; cursor: pointer; text-decoration: none; }
    #disconnect a:hover { text-decoration: underline; }
    .connected { color: #25d366 !important; font-weight: bold; }
    .waiting { color: #667781; }
    .reconnecting { color: #e67e22; }
    .error { color: #e74c3c; }
  </style>
</head>
<body>
  <div class="container">
    <h1>WhatsApp Bot</h1>
    <p id="status" class="waiting">Loading...</p>
    <p id="bot-name"></p>
    <p id="bot-phone"></p>
    <div id="qr-img"></div>
    <div id="disconnect"><a href="#" onclick="disconnect(event)">Disconnect</a></div>
  </div>
  <script>
    const statusEl = document.getElementById('status');
    const nameEl = document.getElementById('bot-name');
    const phoneEl = document.getElementById('bot-phone');
    const qrEl = document.getElementById('qr-img');
    const disconnectEl = document.getElementById('disconnect');

    async function poll() {
      try {
        const res = await fetch('/api/qr');
        const data = await res.json();

        nameEl.textContent = '';
        phoneEl.textContent = '';
        qrEl.innerHTML = '';

        disconnectEl.style.display = 'none';

        if (data.state === 'open') {
          statusEl.textContent = 'Connected!';
          statusEl.className = 'connected';
          nameEl.textContent = data.user?.name || '';
          phoneEl.textContent = data.user?.phone ? '+' + data.user.phone : '';
          disconnectEl.style.display = 'block';
        } else if (data.qr) {
          statusEl.textContent = 'Scan this QR code with WhatsApp';
          statusEl.className = 'waiting';
          qrEl.innerHTML = '<img src="' + data.qr + '" alt="QR Code" />';
        } else if (data.state === 'close') {
          statusEl.textContent = 'Reconnecting...';
          statusEl.className = 'reconnecting';
        } else {
          statusEl.textContent = 'Connecting...';
          statusEl.className = 'waiting';
        }
      } catch (e) {
        statusEl.textContent = 'Error connecting to server';
        statusEl.className = 'error';
      }
    }

    async function disconnect(e) {
      e.preventDefault();
      if (!confirm('Disconnect this device?')) return;
      await fetch('/api/logout', { method: 'POST' });
      poll();
    }

    poll();
    setInterval(poll, 2000);
  </script>
</body>
</html>
